<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SALF - Parametrização</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .error { border-color:#dc3545 !important; }
    .error-text { color:#dc3545; font-size:.875rem; margin-top:.25rem; }
    .form-text { font-size: .8rem; opacity: .85; }
  </style>
</head>
<body>

  <!-- Topo -->
  <nav class="navbar">
    <div class="container-fluid">
      <span class="navbar-brand">
        <img src="larSantaFilomena.png" alt="Logo" class="logo" />
        <div>
          <div>SALF - Lar Santa Filomena</div>
          <small style="font-size: 0.8rem; opacity: 0.9;">Sistema Integrado de Gestão</small>
        </div>
      </span>
      <div class="text-white">
        <i class="bi bi-calendar3"></i>
        <span id="current-date"></span>
      </div>
    </div>
  </nav>

  <div class="main-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <h5><i class="bi bi-gear-fill"></i> Configuração</h5>
      <button class="nav-btn active" disabled><i class="bi bi-building"></i> Parametrização</button>
    </div>

    <!-- Área do Formulário -->
    <div class="content">
      <div class="container mt-4">
        <h2 class="mb-4"><i class="bi bi-building"></i> Configuração da Empresa</h2>

        <!-- IMPORTANTE: names/ids batendo com o back -->
        <form id="paramForm" enctype="multipart/form-data">
          <!-- Identidade/contato -->
          <div class="mb-3">
            <label for="razao_social" class="form-label">Razão Social <span class="required">*</span></label>
            <input type="text" class="form-control" id="razao_social" name="razao_social"
                   required
                   data-validation="required|min:3|max:120"
                   data-msg="Informe a razão social (3 a 120 caracteres).">
            <div class="error-text" data-for="razao_social"></div>
          </div>

          <div class="mb-3">
            <label for="nome_fantasia" class="form-label">Nome Fantasia <span class="required">*</span></label>
            <input type="text" class="form-control" id="nome_fantasia" name="nome_fantasia"
                   required
                   data-validation="required|min:2|max:120"
                   data-msg="Informe o nome fantasia (2 a 120 caracteres).">
            <div class="error-text" data-for="nome_fantasia"></div>
          </div>

          <div class="row g-3">
            <div class="col-md-4">
              <label for="telefone" class="form-label">Telefone <span class="required">*</span></label>
              <input type="tel" class="form-control" id="telefone" name="telefone"
                     required
                     data-validation="required|phone"
                     data-msg="Telefone inválido. Ex: (11) 91234-5678">
              <div class="error-text" data-for="telefone"></div>
            </div>
            <div class="col-md-4">
              <label for="email" class="form-label">E-mail <span class="required">*</span></label>
              <input type="email" class="form-control" id="email" name="email"
                     required
                     data-validation="required|email"
                     data-msg="Informe um e-mail válido.">
              <div class="error-text" data-for="email"></div>
            </div>
            <div class="col-md-4">
              <label for="site" class="form-label">Site</label>
              <input type="url" class="form-control" id="site" name="site"
                     data-validation="max:120"
                     data-msg="Máximo de 120 caracteres.">
              <div class="form-text">Opcional (ex.: https://exemplo.com.br)</div>
              <div class="error-text" data-for="site"></div>
            </div>
          </div>

          <!-- Endereço -->
          <div class="row g-3 mt-1">
            <div class="col-md-6">
              <label for="rua" class="form-label">Rua <span class="required">*</span></label>
              <input type="text" class="form-control" id="rua" name="rua"
                     required
                     data-validation="required|min:3|max:120">
              <div class="error-text" data-for="rua"></div>
            </div>
            <div class="col-md-6">
              <label for="bairro" class="form-label">Bairro <span class="required">*</span></label>
              <input type="text" class="form-control" id="bairro" name="bairro"
                     required
                     data-validation="required|min:2|max:80">
              <div class="error-text" data-for="bairro"></div>
            </div>
          </div>

          <div class="row g-3 mt-1">
            <div class="col-md-5">
              <label for="cidade" class="form-label">Cidade <span class="required">*</span></label>
              <input type="text" class="form-control" id="cidade" name="cidade"
                     required
                     data-validation="required|min:2|max:80">
              <div class="error-text" data-for="cidade"></div>
            </div>
            <div class="col-md-2">
              <label for="uf" class="form-label">UF <span class="required">*</span></label>
              <input type="text" class="form-control text-uppercase" id="uf" name="uf"
                     required
                     data-validation="required|min:2|max:2"
                     data-msg="UF deve ter 2 letras (ex.: SP).">
              <div class="error-text" data-for="uf"></div>
            </div>
            <div class="col-md-5">
              <label for="cep" class="form-label">CEP <span class="required">*</span></label>
              <input type="text" class="form-control" id="cep" name="cep"
                     required
                     data-validation="required|min:8|max:9"
                     data-msg="Informe o CEP (ex.: 01000-000).">
              <div class="error-text" data-for="cep"></div>
            </div>
          </div>

          <!-- Logos -->
          <div class="row g-3 mt-2">
            <div class="col-md-6">
              <label for="logotipo_small" class="form-label">Logotipo Small</label>
              <input type="file" class="form-control" id="logotipo_small" name="logotipo_small" accept="image/*"
                     data-validation="image|maxsize:2MB"
                     data-msg="A imagem deve ter no máximo 2MB.">
              <div class="form-text">Opcional — o sistema pode gerar a versão small automaticamente.</div>
              <div class="error-text" data-for="logotipo_small"></div>
            </div>
            <div class="col-md-6">
              <label for="logotipo_big" class="form-label">Logotipo Big <span class="required">*</span></label>
              <input type="file" class="form-control" id="logotipo_big" name="logotipo_big" accept="image/*"
                     required
                     data-validation="required|image|maxsize:5MB"
                     data-msg="Selecione uma imagem (máx. 5MB).">
              <div class="error-text" data-for="logotipo_big"></div>
            </div>
          </div>

          <div class="mb-3 mt-2">
            <label class="form-label">Pré-visualização:</label><br />
            <div class="d-flex gap-4 align-items-start">
              <div>
                <div class="small text-muted mb-1">Small</div>
                <img id="logoPreviewSmall" alt="Preview Small" style="max-width: 160px; height: auto;" />
              </div>
              <div>
                <div class="small text-muted mb-1">Big</div>
                <img id="logoPreviewBig" alt="Preview Big" style="max-width: 220px; height: auto;" />
              </div>
            </div>
          </div>

          <button id="submitBtn" type="submit" class="btn btn-success">
            <i class="bi bi-save"></i> Salvar
          </button>

          <div id="msg" class="mt-3 text-success"></div>
          <div id="error" class="mt-2 text-danger"></div>
        </form>
      </div>
    </div>
  </div>

  <!-- Rodapé -->
  <div class="footer-info">
    <i class="bi bi-heart-fill"></i> SALF v1.0 © 2025 | Lar Santa Filomena
  </div>

  <script>
    document.getElementById('current-date').textContent = new Date().toLocaleDateString('pt-BR');
  </script>
  <script src="https://unpkg.com/imask"></script>

  <!-- Seu JS com validação por data-validation e envio via FormData -->
  <script src="parametrizacao.js"></script>

  <script>
    // Máscaras básicas (opcional)
    if (window.IMask) {
      IMask(document.getElementById('telefone'), { mask: '(00) 00000-0000' });
      IMask(document.getElementById('cep'), { mask: '00000-000' });
      // UF em maiúsculas automaticamente
      const uf = document.getElementById('uf');
      uf.addEventListener('input', () => { uf.value = uf.value.toUpperCase(); });
    }

    // Previews rápidos (se não fizer no parametrizacao.js)
    (function(){
      const small = document.getElementById('logotipo_small');
      const big = document.getElementById('logotipo_big');
      const prevS = document.getElementById('logoPreviewSmall');
      const prevB = document.getElementById('logoPreviewBig');

      function preview(input, imgEl) {
        const f = input.files?.[0];
        if (!f) { imgEl.removeAttribute('src'); return; }
        const fr = new FileReader();
        fr.onload = e => imgEl.src = e.target.result;
        fr.readAsDataURL(f);
      }
      small.addEventListener('change', () => preview(small, prevS));
      big.addEventListener('change', () => preview(big, prevB));
    })();
  </script>
</body>
</html>
