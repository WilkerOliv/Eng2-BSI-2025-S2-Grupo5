<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SALF • Voluntários</title>
  <!-- Bootstrap & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <!-- Estilo específico -->
  <link rel="stylesheet" href="voluntario.css"/>
</head>
<body>
  <nav class="navbar navbar-dark bg-danger shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
        <img src="larSantaFilomena.png" alt="Lar Santa Filomena" class="logo me-2"/>
        SALF • Voluntários
      </a>
      <div class="text-white small">
        <i class="bi bi-calendar3"></i>
        <span id="current-date"></span>
      </div>
    </div>
  </nav>

  <main class="container my-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="m-0 text-primary"><i class="bi bi-people"></i> Voluntários</h4>
      <div class="d-flex gap-2">
        <a href="campanhas.html" class="btn btn-outline-secondary"><i class="bi bi-flag"></i> Campanhas</a>
        <button class="btn btn-danger" id="vol-btn-novo"><i class="bi bi-plus-circle"></i> Novo</button>
      </div>
    </div>

    <!-- LISTA -->
    <div class="card mb-3">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table align-middle" id="vol-table">
            <thead>
              <tr>
                <th>CPF</th><th>Nome</th><th>Telefone</th><th>Cidade</th><th>Email</th>
                <th style="width:180px">Ações</th>
              </tr>
            </thead>
            <tbody><!-- via JS --></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- FORM -->
    <div class="card d-none" id="vol-form-card">
      <div class="card-body">
        <h5 id="vol-form-title" class="text-danger">Novo Voluntário</h5>
        <form id="vol-form" class="row g-3 mt-1">
          <div class="col-md-4">
            <label class="form-label">CPF</label>
            <input class="form-control" id="vol-cpf" required />
          </div>
          <div class="col-md-4">
            <label class="form-label">Nome</label>
            <input class="form-control" id="vol-nome" required />
          </div>
          <div class="col-md-4">
            <label class="form-label">Telefone</label>
            <input class="form-control" id="vol-tel" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Cidade</label>
            <input class="form-control" id="vol-cidade" />
          </div>
          <div class="col-md-2">
            <label class="form-label">UF</label>
            <input class="form-control" id="vol-uf" />
          </div>
          <div class="col-md-2">
            <label class="form-label">CEP</label>
            <input class="form-control" id="vol-cep" />
          </div>
          <div class="col-md-4">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-control" id="vol-email" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Username</label>
            <input class="form-control" id="vol-user" />
          </div>
          <div class="col-12 d-flex gap-2">
            <button class="btn btn-danger" type="submit"><i class="bi bi-save"></i> Salvar</button>
            <button class="btn btn-secondary" type="button" id="vol-cancelar"><i class="bi bi-x"></i> Cancelar</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Lógica desta página -->
  <script src="voluntarios.js"></script>
</body>
</html>
