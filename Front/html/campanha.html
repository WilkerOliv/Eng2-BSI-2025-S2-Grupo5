<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SALF • Campanhas</title>
  <!-- Bootstrap & Icons (opcional, já estiliza botões/tabelas) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <!-- Estilo específico da página -->
  <link rel="stylesheet" href="campanha.css"/>
</head>
<body>
  <nav class="navbar navbar-dark bg-danger shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
        <img src="larSantaFilomena.png" alt="Lar Santa Filomena" class="logo me-2"/>
        SALF • Campanhas
      </a>
      <div class="text-white small">
        <i class="bi bi-calendar3"></i>
        <span id="current-date"></span>
      </div>
    </div>
  </nav>

  <main class="container my-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="m-0 text-primary"><i class="bi bi-flag"></i> Campanhas</h4>
      <div class="d-flex gap-2">
        <a href="voluntarios.html" class="btn btn-outline-secondary"><i class="bi bi-people"></i> Voluntários</a>
        <button id="cmp-btn-nova" class="btn btn-danger"><i class="bi bi-plus-circle"></i> Nova</button>
      </div>
    </div>

    <!-- LISTA -->
    <div class="card mb-3">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table align-middle" id="cmp-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Descrição</th>
                <th>Início</th>
                <th>Fim</th>
                <th>Total</th>
                <th style="width:230px">Ações</th>
              </tr>
            </thead>
            <tbody><!-- preenchido via JS --></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- FORMULÁRIO (criar/editar) -->
    <div class="card mb-3 d-none" id="cmp-form-card">
      <div class="card-body">
        <h5 id="cmp-form-title" class="text-danger">Nova Campanha</h5>
        <form id="cmp-form" class="row g-3 mt-1">
          <input type="hidden" id="cmp-id" />
          <div class="col-md-6">
            <label class="form-label">Descrição</label>
            <input class="form-control" id="cmp-descr" required />
          </div>
          <div class="col-md-3">
            <label class="form-label">Início</label>
            <input type="date" class="form-control" id="cmp-ini" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Fim</label>
            <input type="date" class="form-control" id="cmp-fim" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Observação</label>
            <input class="form-control" id="cmp-obs" />
          </div>
          <div class="col-12 d-flex gap-2">
            <button class="btn btn-danger" type="submit"><i class="bi bi-save"></i> Salvar</button>
            <button class="btn btn-secondary" type="button" id="cmp-cancelar"><i class="bi bi-x"></i> Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- DETALHE + RESPONSÁVEIS + FINALIZAÇÃO -->
    <div class="card d-none" id="cmp-detalhe-card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center">
          <h5 id="cmp-det-title" class="text-danger m-0">Campanha</h5>
          <div class="d-flex gap-2">
            <button class="btn btn-success" id="cmp-finalizar-open"><i class="bi bi-coin"></i> Finalizar</button>
            <button class="btn btn-secondary" id="cmp-detalhe-fechar"><i class="bi bi-arrow-left"></i> Voltar</button>
          </div>
        </div>
        <hr/>
        <div class="row g-3" id="cmp-det-stats"></div>

        <div class="module-divider mt-3"><small><i class="bi bi-people"></i> VOLUNTÁRIOS RESPONSÁVEIS</small></div>
        <div class="row g-2 align-items-end mb-2">
          <div class="col-md-4">
            <label class="form-label">CPF do voluntário</label>
            <input class="form-control" id="cmp-resp-cpf" placeholder="000.000.000-00" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Cargo (opcional)</label>
            <input class="form-control" id="cmp-resp-cargo" placeholder="Coordenador" />
          </div>
          <div class="col-md-4">
            <button class="btn btn-danger w-100" id="cmp-resp-add"><i class="bi bi-link-45deg"></i> Vincular</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table align-middle" id="cmp-resp-table">
            <thead><tr><th>CPF</th><th>Cargo</th><th style="width:120px">Ações</th></tr></thead>
            <tbody><!-- preenchido via JS --></tbody>
          </table>
        </div>

        <div class="module-divider mt-3"><small><i class="bi bi-coin"></i> FINALIZAÇÃO</small></div>
        <div class="row g-2 align-items-end">
          <div class="col-md-4">
            <label class="form-label">Total arrecadado</label>
            <input type="number" step="0.01" class="form-control" id="cmp-finalizar-total" />
          </div>
          <div class="col-md-4">
            <button class="btn btn-success w-100" id="cmp-finalizar-save"><i class="bi bi-check2-circle"></i> Lançar resultado</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Lógica desta página -->
  <script src="campanha.js"></script>
</body>
</html>
