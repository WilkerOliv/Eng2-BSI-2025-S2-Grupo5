<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Produtos - SALF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>

<body class="bg-light">

<div class="container py-4">

    <h3 class="mb-3">Cadastro de Produtos</h3>

    <div id="alert"></div>

    <div class="card p-3 mb-4">
        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Descrição *</label>
                <input type="text" id="prodDescr" class="form-control"/>
            </div>

            <div class="col-md-4">
                <label class="form-label">Categoria *</label>
                <select id="categoria" class="form-select"></select>
            </div>

            <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-primary w-100" id="btnSalvar">Salvar</button>
            </div>
        </div>
    </div>

    <h4>Lista de Produtos</h4>
    <table class="table table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Descrição</th>
            <th>Categoria</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="tabelaProdutos"></tbody>
    </table>

</div>

<script src="./produto.js"></script>
</body>
</html>
