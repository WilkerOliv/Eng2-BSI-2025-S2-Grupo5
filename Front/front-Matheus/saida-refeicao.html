<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <title>Registrar Saída de Refeição - SALF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="../css/style-wilker.css" rel="stylesheet" />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .autocomplete-box {
            position: absolute;
            top: 100%;
            background: white;
            border: 1px solid #ddd;
            width: 100%;
            z-index: 9999;
            border-radius: 4px;
            max-height: 240px;
            overflow-y: auto;
        }

        .autocomplete-item {
            padding: 8px 10px;
            cursor: pointer;
        }

        .autocomplete-item:hover {
            background-color: #f0f0f0;
        }

        .tag-item {
            padding: 4px 10px;
            background: #0d6efd;
            color: white;
            margin: 4px;
            border-radius: 6px;
            display: inline-block;
        }
    </style>
</head>

<body class="bg-light">
<div class="container py-4">

    <div class="wilker-card mb-4">
        <h3>Registrar Saída de Refeição</h3>
        <p class="text-muted">Selecione apenas itens da categoria <strong>Alimentos</strong>.</p>

        <div id="alert-area"></div>

        <div class="row g-3">

            <!-- CPF -->
            <div class="col-md-4">
                <label class="form-label-required">CPF Funcionário</label>
                <input type="text" id="cpfFunc" class="form-control" placeholder="000.000.000-00">
            </div>

            <!-- Observação -->
            <div class="col-md-8">
                <label class="form-label">Observação</label>
                <input type="text" id="obsSaida" class="form-control">
            </div>

            <!-- BUSCA DE ITEM -->
            <div class="col-md-6 position-relative">
                <label class="form-label-required">Buscar Item (somente alimentos)</label>
                <input type="text" id="buscarItem" class="form-control" placeholder="Digite nome ou ID">
                <div id="autoItem" class="autocomplete-box" style="display:none;"></div>
            </div>

            <!-- SELECIONAR LOTE -->
            <div class="col-md-3">
                <label class="form-label-required">Lotes disponíveis</label>
                <select id="selectLote" class="form-select"></select>
            </div>

            <!-- Quantidade -->
            <div class="col-md-3">
                <label class="form-label-required">Quantidade</label>
                <input type="number" id="qtdItem" class="form-control" min="1">
            </div>

            <div class="col-12 d-flex justify-content-end">
                <button id="btnAddItem" class="btn btn-primary">Adicionar Item</button>
            </div>
        </div>

        <hr class="my-4">

        <h5>Itens Selecionados</h5>
        <table class="table table-striped">
            <thead class="table-dark">
            <tr>
                <th>ID Lote</th>
                <th>Produto</th>
                <th>Qtd</th>
                <th>Validade</th>
                <th>Ação</th>
            </tr>
            </thead>
            <tbody id="tbItens"></tbody>
        </table>

        <div class="text-end">
            <button id="btnSalvar" class="btn btn-success">Registrar Saída</button>
        </div>

    </div>

    <a href="../index.html" class="btn btn-link">Voltar ao menu</a>

</div>

<script src="../front-Wilker/js/utils.js"></script>
<script src="./js/saida-refeicao.js"></script>

</body>
</html>
