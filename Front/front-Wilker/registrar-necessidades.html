<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Registrar Necessidade - SALF</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">
  <div class="container">
    <h1 class="mb-4">Registrar Necessidade</h1>

    <!-- Formulário -->
    <div class="card mb-3 shadow-sm">
      <div class="card-body">
        <form id="formNecessidade">
          <input type="hidden" id="cpfEdicao">
          <input type="hidden" id="produtoEdicao">

          <div class="row g-2">
            <div class="col-md-4">
              <label for="selPessoa" class="form-label">Pessoa</label>
              <select id="selPessoa" class="form-select" required></select>
            </div>
            <div class="col-md-4">
              <label for="selProduto" class="form-label">Produto</label>
              <select id="selProduto" class="form-select" required></select>
            </div>
            <div class="col-md-2">
              <label for="quantidadeNecessidade" class="form-label">Quantidade</label>
              <input id="quantidadeNecessidade" class="form-control" type="number" min="1" required>
            </div>
            <div class="col-md-2">
              <label for="dataNecessidade" class="form-label">Data</label>
              <input id="dataNecessidade" class="form-control" type="date" required>
            </div>

            <div class="col-12 mt-2">
              <label for="obsNecessidade" class="form-label">Observação</label>
              <input id="obsNecessidade" class="form-control" placeholder="Observação (opcional)">
            </div>

            <div class="col-12 mt-3 d-flex justify-content-end">
              <button id="btnRegistrar" class="btn btn-success" type="submit">Registrar</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabela -->
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Pessoa (CPF)</th>
          <th>Produto</th>
          <th>Quantidade</th>
          <th>Data</th>
          <th class="text-center">Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaNecessidadesBody">
        <tr><td colspan="5" class="text-center">Carregando...</td></tr>
      </tbody>
    </table>

    <a href="../index.html" class="btn btn-link mt-3">Voltar</a>
  </div>

  <script src="../js/api-wilker.js"></script>
  <script src="../js/necessidades.js"></script>
</body>
</html>
