<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Categorias - SALF</title>
  <link rel="stylesheet" href="../../styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">
  <div class="container">
    <h1 class="mb-4">Categorias de Produto</h1>

    <!-- Formulário -->
    <div class="card mb-3">
      <div class="card-body">
        <form id="formCategoria">
          <div class="row g-2">
            <div class="col-md-9">
              <input id="categoriaDescricao" class="form-control" placeholder="Descrição da categoria" required>
            </div>
            <div class="col-md-3">
              <button class="btn btn-success w-100" type="submit">Adicionar</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabela -->
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Descrição</th>
          <th class="text-center">Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaCategoriasBody">
        <tr><td colspan="3" class="text-center">Carregando...</td></tr>
      </tbody>
    </table>

    <a href="../../index.html" class="btn btn-link mt-3">Voltar</a>
  </div>

  <!-- Scripts -->
  <script src="./js/api-wilker.js"></script>
  <script src="./js/categorias-produto.js"></script>
</body>
</html>
