<!-- Front/front-Wilker/necessidades.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Registrar Necessidades - SALF</title>
  <link href="../css/style-wilker.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container-wilker">
    <div class="wilker-card">
      <h3>Registrar Necessidades de Pessoas Carentes</h3>
      <div id="alert-container"></div>

      <form id="formNecessidade" class="row g-3">
        <div class="col-md-3">
          <label for="pessoaCpf" class="form-label form-label-required">CPF da Pessoa</label>
          <input type="text" id="pessoaCpf" class="form-control" placeholder="00000000000">
          <div id="pessoaCpfError" class="field-error" style="display:none;"></div>
        </div>

        <div class="col-md-3">
          <label for="produtoId" class="form-label form-label-required">ID do Produto</label>
          <input type="number" id="produtoId" class="form-control" min="0">
          <div id="produtoIdError" class="field-error" style="display:none;"></div>
        </div>

        <div class="col-md-2">
          <label for="quantidade" class="form-label form-label-required">Quantidade</label>
          <input type="number" id="quantidade" class="form-control" min="1" value="1">
          <div id="quantidadeError" class="field-error" style="display:none;"></div>
        </div>

        <div class="col-md-2">
          <label for="data" class="form-label form-label-required">Data</label>
          <input type="date" id="data" class="form-control">
          <div id="dataError" class="field-error" style="display:none;"></div>
        </div>

        <div class="col-md-10">
          <label for="observacao" class="form-label">Observação</label>
          <input type="text" id="observacao" class="form-control" placeholder="Observação (opcional)">
        </div>

        <div class="col-md-2 d-flex align-items-end gap-2">
          <button id="btnSalvar" class="btn btn-wilker-primary">Salvar</button>
          <button id="btnLimpar" type="button" class="btn btn-secondary">Limpar</button>
        </div>
      </form>

      <hr>

      <div class="search-box">
        <input id="buscar" class="form-control" placeholder="Buscar por CPF ou observação (ex: *palavra*)" />
        <button id="btnBuscar" class="btn btn-outline-primary btn-small">Buscar</button>
        <button id="btnResetBusca" class="btn btn-outline-secondary btn-small">Limpar</button>
      </div>

      <div class="table-responsive">
        <table class="table-wilker table" id="tabelaNecessidades">
          <thead>
            <tr>
              <th>CPF Pessoa</th>
              <th>Produto ID</th>
              <th>Data</th>
              <th>Quantidade</th>
              <th>Observação</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <a href="../index.html" class="btn btn-link mt-2">Voltar ao menu</a>
  </div>

  <script src="./js/utils.js"></script>
  <script src="./js/necessidades.js"></script>
</body>
</html>
