<!-- Front/front-Wilker/categorias.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerenciar Categorias - SALF</title>
  <link href="../css/style-wilker.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container-wilker">
    <div class="wilker-card">
      <h3>Gerenciar Categorias</h3>
      <div id="alert-container"></div>

      <form id="formCategoria" class="row g-3">
        <input type="hidden" id="catCod">
        <div class="col-md-8">
          <label for="catDescr" class="form-label form-label-required">Descrição</label>
          <input type="text" id="catDescr" class="form-control" placeholder="Descrição da categoria">
          <div id="catDescrError" class="field-error" style="display:none;"></div>
        </div>

        <div class="col-md-4 d-flex align-items-end gap-2">
          <button id="btnSalvar" class="btn btn-wilker-primary">Salvar</button>
          <button id="btnLimpar" type="button" class="btn btn-secondary">Limpar</button>
        </div>
      </form>

      <hr>

      <div class="search-box">
        <input id="buscar" class="form-control" placeholder="Buscar por nome (ex: *palavra*)" />
        <button id="btnBuscar" class="btn btn-outline-primary btn-small">Buscar</button>
        <button id="btnResetBusca" class="btn btn-outline-secondary btn-small">Limpar</button>
      </div>

      <div class="table-responsive">
        <table class="table-wilker table" id="tabelaCategorias">
          <thead>
            <tr>
              <th>ID</th>
              <th>Descrição</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <a href="../index.html" class="btn btn-link mt-2">Voltar ao menu</a>
  </div>

  <script src="./js/utils.js"></script>
  <script src="./js/categorias.js"></script>
</body>
</html>
