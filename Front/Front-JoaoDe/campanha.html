<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciar Campanhas - SALF</title>

  <!-- Bootstrap + Icons + CSS Global -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="principal.css" />

  <style>
    .campanha-container {
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .btn-salf {
      background-color: var(--salf-red, #c0392b);
      border: none;
      color: white;
    }
    .btn-salf:hover {
      background-color: #a93226;
      color: white;
    }
    .table-responsive {
      margin-top: 20px;
    }
    .status-badge {
      padding: 5px 10px;
      border-radius: 5px;
      font-weight: bold;
    }
    .status-Em-Andamento { background-color: #f0ad4e; color: white; }
    .status-Finalizada { background-color: #5cb85c; color: white; }
    .status-Cancelada { background-color: #d9534f; color: white; }
  </style>
</head>
<body>

  <div class="container mt-5">
    <div class="campanha-container">
      <h1 class="mb-4 text-center">Gerenciar Campanhas</h1>

      <!-- Botão para abrir o modal de cadastro -->
      <button type="button" class="btn btn-salf mb-3" data-bs-toggle="modal" data-bs-target="#campanhaModal">
        <i class="bi bi-plus-circle"></i> Nova Campanha
      </button>

      <!-- Tabela de Listagem de Campanhas -->
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Início</th>
              <th>Fim</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="campanhaTableBody">
            <!-- Linhas de campanhas serão inseridas aqui pelo JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal de Cadastro/Edição de Campanha -->
  <div class="modal fade" id="campanhaModal" tabindex="-1" aria-labelledby="campanhaModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="campanhaModalLabel">Cadastrar Campanha</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="campanhaForm">
            <input type="hidden" id="campanhaId" name="id">
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="nome" class="form-label">Nome <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="nome" name="nome" required>
              </div>
              <div class="col-md-3 mb-3">
                <label for="dataInicio" class="form-label">Data Início <span class="text-danger">*</span></label>
                <input type="date" class="form-control" id="dataInicio" name="dataInicio" required>
              </div>
              <div class="col-md-3 mb-3">
                <label for="dataFim" class="form-label">Data Fim <span class="text-danger">*</span></label>
                <input type="date" class="form-control" id="dataFim" name="dataFim" required>
              </div>
            </div>
            
            <div class="mb-3">
              <label for="observacao" class="form-label">Observações</label>
              <textarea class="form-control" id="observacao" name="observacao" rows="3"></textarea>
            </div>

            <div class="mb-3" id="statusField" style="display: none;">
              <label for="status" class="form-label">Status</label>
              <select class="form-select" id="status" name="status">
                <option value="Em Andamento">Em Andamento</option>
                <option value="Finalizada">Finalizada</option>
                <option value="Cancelada">Cancelada</option>
              </select>
            </div>

            <h5 class="mt-4">Voluntários Responsáveis</h5>
            <div id="voluntariosContainer" class="mb-3 border p-3 rounded">
              <!-- Checkboxes de voluntários serão carregados aqui -->
            </div>
            
            <div id="formMessage" class="alert d-none" role="alert"></div>
            
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-salf">Salvar Campanha</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/campanha.js"></script>
</body>
</html>
