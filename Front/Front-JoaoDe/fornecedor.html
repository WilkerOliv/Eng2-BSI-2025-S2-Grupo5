<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciar Fornecedores - SALF</title>

  <!-- Bootstrap + Icons + CSS Global -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="principal.css" /> <!-- Reutilizando o CSS principal para layout -->

  <style>
    .fornecedor-container {
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .btn-salf {
      background-color: var(--salf-red, #c0392b);
      border: none;
      color: white;
    }
    .btn-salf:hover {
      background-color: #a93226;
      color: white;
    }
    .table-responsive {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container mt-5">
    <div class="fornecedor-container">
      <h1 class="mb-4 text-center">Gerenciar Fornecedores</h1>

      <!-- Botão para abrir o modal de cadastro -->
      <button type="button" class="btn btn-salf mb-3" data-bs-toggle="modal" data-bs-target="#fornecedorModal">
        <i class="bi bi-plus-circle"></i> Novo Fornecedor
      </button>

      <!-- Tabela de Listagem de Fornecedores -->
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>CNPJ</th>
              <th>Telefone</th>
              <th>E-mail</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="fornecedorTableBody">
            <!-- Linhas de fornecedores serão inseridas aqui pelo JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal de Cadastro/Edição de Fornecedor -->
  <div class="modal fade" id="fornecedorModal" tabindex="-1" aria-labelledby="fornecedorModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="fornecedorModalLabel">Cadastrar Fornecedor</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="fornecedorForm">
            <input type="hidden" id="fornecedorId" name="id">
            
            <div class="mb-3">
              <label for="nome" class="form-label">Nome <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="nome" name="nome" required>
            </div>
            <div class="mb-3">
              <label for="cnpj" class="form-label">CNPJ <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="cnpj" name="cnpj" required>
            </div>
            <div class="mb-3">
              <label for="telefone" class="form-label">Telefone <span class="text-danger">*</span></label>
              <input type="tel" class="form-control" id="telefone" name="telefone" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">E-mail <span class="text-danger">*</span></label>
              <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
              <label for="contato" class="form-label">Pessoa de Contato</label>
              <input type="text" class="form-control" id="contato" name="contato">
            </div>
            <div class="mb-3">
              <label for="descricao" class="form-label">Descrição/Observações</label>
              <textarea class="form-control" id="descricao" name="descricao" rows="3"></textarea>
            </div>
            
            <div id="formMessage" class="alert d-none" role="alert"></div>
            
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-salf">Salvar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/fornecedor.js"></script>
</body>
</html>
